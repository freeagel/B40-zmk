# User configuration loaded by ZMK_CONFIG for the b40 build.
# Disable 2 Mbps PHY for BLE connection compatibility testing.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable runtime keymap editing through ZMK Studio.
CONFIG_ZMK_STUDIO=y

# Enable mouse scroll bindings on the Nav layer.
CONFIG_ZMK_POINTING=y

# Enable manual soft-off from the keymap.
CONFIG_ZMK_PM_SOFT_OFF=y

# Report battery percentage from the nRF52840 VDDH voltage measurement.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
